<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Notification Demo</title>
    <link rel="stylesheet" href="style/notification.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #1f2937;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-error {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn-error:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.3);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
        }

        .btn-info {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }

        .btn-info:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
            grid-column: 1 / -1;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .position-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e5e7eb;
        }

        .position-section h3 {
            color: #374151;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .position-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .position-buttons button {
            padding: 10px 12px;
            font-size: 13px;
            background: #f3f4f6;
            color: #1f2937;
            font-weight: 500;
        }

        .position-buttons button:hover {
            background: #e5e7eb;
        }

        .options-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e5e7eb;
        }

        .options-section h3 {
            color: #374151;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            cursor: pointer;
            color: #374151;
            font-size: 14px;
        }

        .duration-control {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .duration-control label {
            color: #374151;
            font-size: 14px;
            min-width: 80px;
        }

        .duration-control input[type="number"] {
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            width: 100px;
        }

        .custom-message {
            margin-top: 20px;
        }

        .custom-message textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
        }

        .custom-message button {
            margin-top: 10px;
            width: 100%;
            grid-column: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Modern Notification</h1>
        <p class="subtitle">Notifikasi pop-up yang modern dan tidak kaku</p>

        <div class="button-group">
            <button class="btn-success" onclick="showSuccess('Berhasil! Data telah disimpan.')">✓ Success</button>
            <button class="btn-error" onclick="showError('Error! Terjadi kesalahan.')">✕ Error</button>
            <button class="btn-warning" onclick="showWarning('Perhatian! Pastikan data benar.')">⚠ Warning</button>
            <button class="btn-info" onclick="showInfo('Info: Proses sedang berlangsung...')">ℹ Info</button>
        </div>

        <div class="position-section">
            <h3>Pilih Posisi Notifikasi</h3>
            <div class="position-buttons">
                <button onclick="showSuccess('Top Right', { position: 'top-right' })">Top Right</button>
                <button onclick="showSuccess('Top Left', { position: 'top-left' })">Top Left</button>
                <button onclick="showSuccess('Bottom Right', { position: 'bottom-right' })">Bottom Right</button>
                <button onclick="showSuccess('Bottom Left', { position: 'bottom-left' })">Bottom Left</button>
            </div>
        </div>

        <div class="options-section">
            <h3>Opsi Tambahan</h3>
            <div class="checkbox-group">
                <input type="checkbox" id="soundToggle">
                <label for="soundToggle">Putar suara notifikasi</label>
            </div>

            <div class="duration-control">
                <label for="durationInput">Durasi (ms):</label>
                <input type="number" id="durationInput" value="3000" min="1000" max="10000" step="500">
            </div>

            <div class="custom-message">
                <textarea id="customMessage" placeholder="Masukkan pesan custom..."></textarea>
                <button class="btn-secondary" onclick="showCustomNotification()">Tampilkan Notifikasi Custom</button>
            </div>
        </div>
    </div>

    <script src="function.js"></script>
    <script>
        function showCustomNotification() {
            const message = document.getElementById('customMessage').value || 'Pesan notifikasi custom';
            const duration = parseInt(document.getElementById('durationInput').value) || 3000;
            const sound = document.getElementById('soundToggle').checked;

            showSuccess(message, {
                duration: duration,
                sound: sound,
                position: 'top-right'
            });
        }

        // Extended examples
        function showSuccess(message, options = {}) {
            return new Notification({
                message,
                type: 'success',
                ...options
            }).show();
        }

        function showError(message, options = {}) {
            return new Notification({
                message,
                type: 'error',
                ...options
            }).show();
        }

        function showWarning(message, options = {}) {
            return new Notification({
                message,
                type: 'warning',
                ...options
            }).show();
        }

        function showInfo(message, options = {}) {
            return new Notification({
                message,
                type: 'info',
                ...options
            }).show();
        }
    </script>
</body>
</html>
