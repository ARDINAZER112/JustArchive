<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelKu - Platform Menulis Masa Kini</title>
    <link rel="icon" type="image/x-icon" href="novelicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    
    <script src="noverjs.js"></script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .serif { font-family: 'Playfair Display', serif; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); }
        .gradient-text { background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .profile-ring { border: 2px solid transparent; background: linear-gradient(white, white) padding-box, linear-gradient(135deg, #4F46E5, #7C3AED) border-box; }
        .ql-container.ql-snow { border: none !important; font-size: 1.1rem; }
        .ql-toolbar.ql-snow { border: none !important; border-bottom: 1px solid #e2e8f0 !important; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4F46E5; }
    </style>
</head>
<body class="bg-[#F9FAFB] text-slate-900 overflow-x-hidden">

    <div id="toast-container" class="fixed top-24 right-6 z-50 flex flex-col gap-3"></div>

    <nav class="sticky top-0 z-40 glass border-b border-slate-200/60 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer group" onclick="showView('home')">
                <div class="bg-indigo-600 p-2.5 rounded-2xl text-white shadow-indigo-200 shadow-xl group-hover:scale-110 transition-transform">
                   <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h6"/><path d="M8 11h8"/></svg>
                </div>
                <span class="text-2xl font-extrabold tracking-tighter">Novel<span class="text-indigo-600">Ku</span></span>
            </div>
            <div id="nav-actions" class="flex items-center gap-6"></div>
        </div>
    </nav>

    <main id="app-view" class="max-w-7xl mx-auto px-6 py-12 min-h-screen"></main>

    <input type="file" id="avatar-input" accept="image/png, image/jpeg, image/jpg, image/webp" class="hidden" onchange="handleAvatarUpload(event)">

    <input type="file" id="poster-input" accept="image/png, image/jpeg, image/jpg, image/webp" class="hidden" onchange="handlePosterPreview(event)">

    <div id="reader-view" class="fixed inset-0 bg-white z-50 hidden overflow-y-auto">
        <div class="sticky top-0 bg-white/95 backdrop-blur-md border-b px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between z-10">
            <button onclick="closeReader()" class="p-2 hover:bg-slate-100 rounded-full transition-all text-slate-500 hover:text-indigo-600">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="text-center px-2 sm:px-4 flex-1 max-w-lg overflow-hidden">
                <h2 id="reader-title" class="font-extrabold text-slate-900 truncate text-base sm:text-lg">Memuat...</h2>
                <div class="flex items-center justify-center gap-1.5 sm:gap-2 mt-0.5">
                    <img id="reader-avatar" src="" class="w-4 h-4 sm:w-5 sm:h-5 rounded-full object-cover hidden">
                    <p id="reader-author" class="text-[9px] sm:text-[10px] font-black text-indigo-600 uppercase tracking-[0.2em] truncate">MEMUAT PENULIS</p>
                </div>
            </div>
            <div class="flex items-center gap-1 sm:gap-2">
                <button onclick="document.getElementById('reader-content').classList.toggle('text-2xl')" class="p-2 text-slate-400 hover:text-slate-600 font-serif text-sm sm:text-base">A+</button>
            </div>
        </div>
        <div class="max-w-3xl mx-auto px-6 sm:px-8 py-10 sm:py-16">
            <div id="reader-content" class="serif text-slate-800 text-lg sm:text-xl leading-[1.8] transition-all break-words"></div>
        </div>
    </div>

    <script>
        // Setup PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</body>
</html>
