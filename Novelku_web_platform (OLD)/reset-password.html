<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atur Ulang Kata Sandi - NovelKu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#F9FAFB] flex items-center justify-center min-h-screen p-6">
<div class="max-w-md w-full bg-white p-8 sm:p-12 rounded-[40px] sm:rounded-[50px] shadow-2xl shadow-indigo-100 border border-slate-50">
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900 mb-2 tracking-tight text-center">Kata Sandi Baru</h1>
        <p class="text-center text-slate-400 text-sm mb-10 font-medium">Silakan masukkan kata sandi baru yang kuat untuk akun kamu.</p>
        
        <div class="space-y-4">
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-2 block">Kata Sandi Baru</label>
                <input type="password" id="new-password" placeholder="Min. 6 Karakter" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 font-bold transition-all">
            </div>
            
            <button onclick="handleUpdatePassword()" id="btn-update" class="w-full py-5 bg-indigo-600 text-white rounded-2xl font-black shadow-xl shadow-indigo-200 hover:bg-indigo-700 transition-all active:scale-95 mt-4 uppercase tracking-widest text-sm">
                Perbarui Kata Sandi
            </button>
            
            <p id="msg" class="text-center text-sm font-bold mt-4"></p>
        </div>
    </div>

    <script>
        // Sesuaikan dengan API Key yang ada di noverjs.js kamu
        const SUPABASE_URL = 'https://bqplhvnkigosfeodcjoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxcGxodm5raWdvc2Zlb2Rjam95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNjI5MzgsImV4cCI6MjA5MjkzODkzOH0.maYEJAZqccHbfrBKbk_INXb3cD9cMdNvae3ngKcVXDI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleUpdatePassword() {
            const newPassword = document.getElementById('new-password').value;
            const btn = document.getElementById('btn-update');
            const msg = document.getElementById('msg');

            if (newPassword.length < 6) {
                msg.innerText = "Kata sandi minimal 6 karakter!";
                msg.className = "text-center text-sm font-bold mt-4 text-red-500";
                return;
            }

            btn.disabled = true;
            btn.innerText = "MEMPROSES...";

            // Supabase secara otomatis mengenali sesi reset dari URL yang dikirim ke email
            const { error } = await _supabase.auth.updateUser({ password: newPassword });

            if (error) {
                msg.innerText = "Gagal: " + error.message;
                msg.className = "text-center text-sm font-bold mt-4 text-red-500";
                btn.disabled = false;
                btn.innerText = "PERBARUI KATA SANDI";
            } else {
                msg.innerText = "Berhasil! Mengalihkan...";
                msg.className = "text-center text-sm font-bold mt-4 text-green-500";
                setTimeout(() => { window.location.href = 'novelku.html'; }, 2000);
            }
        }
    </script>
</body>
</html>
