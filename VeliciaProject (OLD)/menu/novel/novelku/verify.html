<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akun Terverifikasi - NovelKu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    /* Animasi Transisi Halus (NovelKu) */
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInLeft {
            0% { opacity: 0; transform: translateX(-40px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        .animate-fade-in-up { animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .animate-fade-in-left { animation: fadeInLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; opacity: 0; }
        
        /* Utilitas Jeda Animasi (Delay) */
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }
    </style>
    
    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.getItem('novelku-theme') === 'dark' || (!('novelku-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-white dark:bg-slate-950 m-0 p-0 overflow-x-hidden transition-colors duration-300">
    <div class="flex flex-col md:flex-row min-h-screen">
        
        <div class="animate-fade-in-left w-full md:w-5/12 lg:w-1/2 p-8 sm:p-12 md:p-16 flex flex-col justify-between md:justify-center text-white relative overflow-hidden min-h-[40vh] md:min-h-screen bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1457369804613-52c61a468e7d?q=80&w=1000&auto=format&fit=crop');">
    
    <div class="absolute inset-0 bg-slate-900/60 dark:bg-slate-900/80"></div>
            <div class="absolute -top-32 -left-32 w-80 h-80 bg-white opacity-10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-white opacity-10 rounded-full blur-3xl"></div>
            
            <div class="relative z-10 flex-1 flex flex-col justify-center">
                <div class="flex items-center gap-3 mb-6 md:mb-10">
                    <div class="bg-white/20 p-2.5 md:p-3 rounded-2xl backdrop-blur-sm">
                       <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h6"/><path d="M8 11h8"/></svg>
                    </div>
                    <span class="text-2xl md:text-3xl font-extrabold tracking-tighter">NovelKu</span>
                </div>
                <h2 class="text-3xl md:text-5xl font-black mb-4 md:mb-6 tracking-tight leading-tight">Verifikasi<br>Berhasil!</h2>
                <p class="text-emerald-100 font-medium leading-relaxed text-sm md:text-lg max-w-md">Langkah terakhir telah selesai. Selamat bergabung di komunitas NovelKu.</p>
            </div>
        </div>

        <div class="animate-fade-in-up w-full md:w-7/12 lg:w-1/2 p-8 sm:p-12 lg:p-20 flex flex-col justify-center items-center bg-white dark:bg-slate-950 min-h-[60vh] md:min-h-screen text-center">
            <div class="max-w-md w-full">
                <div class="w-24 h-24 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-500 dark:text-emerald-400 rounded-[30px] flex items-center justify-center mx-auto mb-8 shadow-2xl shadow-emerald-100/50 dark:shadow-emerald-900/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                </div>
                
                <h1 class="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white mb-4 tracking-tight">Akun Aktif!</h1>
                <p class="text-slate-500 dark:text-slate-400 mb-10 leading-relaxed text-sm sm:text-base">Kamu sudah bisa mulai menerbitkan naskah dan membaca ribuan karya lainnya. Mengalihkan secara otomatis...</p>
                
                <a href="novelku.html" class="block w-full py-4 md:py-5 bg-slate-900 dark:bg-emerald-600 text-white rounded-2xl font-black shadow-lg hover:bg-emerald-600 hover:shadow-emerald-200 dark:hover:bg-emerald-500 dark:hover:shadow-emerald-900/50 transition-all active:scale-95 uppercase tracking-widest text-sm">
                    Masuk ke NovelKu
                </a>
            </div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = 'novelku.html';
        }, 3000);
    </script>
</body>
</html>
