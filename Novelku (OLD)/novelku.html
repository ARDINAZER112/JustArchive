<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelKu</title>
    <link rel="icon" type="image/x-icon" href="novelicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .serif { font-family: 'Playfair Display', serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .gradient-text { background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .profile-ring { border: 2px solid transparent; background: linear-gradient(white, white) padding-box, linear-gradient(135deg, #4F46E5, #7C3AED) border-box; }
    </style>
</head>
<body class="bg-[#F9FAFB] text-slate-900">

    <!-- Status Koneksi Supabase
    <div id="db-status" class="bg-slate-950 text-slate-500 py-1.5 px-6 text-[10px] font-mono tracking-widest flex items-center justify-center gap-2 uppercase text-center">
        <div id="status-indicator" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></div>
        <span id="status-text">Supabase PostgreSQL: Memeriksa Konfigurasi...</span>
    </div>-->

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 glass border-b border-slate-200/60 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showView('home')">
                <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg">
                   <img src="book.png" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h6"/><path d="M8 11h8"/></img>
                </div>
                <span class="text-xl font-extrabold tracking-tight">Novel<span class="text-indigo-600">Ku</span></span>
            </div>
            <div id="nav-actions" class="flex items-center gap-4"></div>
        </div>
    </nav>

    <!-- App Content -->
    <main id="app-view" class="max-w-7xl mx-auto px-6 py-10"></main>

    <!-- Hidden Input for Avatar -->
    <input type="file" id="avatar-input" accept="image/png, image/jpeg" class="hidden" onchange="handleAvatarUpload(event)">

    <!-- Reader Overlay -->
    <div id="reader-view" class="fixed inset-0 bg-white z- hidden overflow-y-auto">
        <div class="sticky top-0 bg-white/90 backdrop-blur border-b px-6 py-3 flex items-center justify-between">
            <button onclick="closeReader()" class="p-2 hover:bg-slate-100 rounded-full transition-all text-slate-500">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="text-center px-4 max-w-md">
                <h2 id="reader-title" class="font-bold text-slate-900 truncate">Memuat...</h2>
                <div class="flex items-center justify-center gap-2">
                    <img id="reader-avatar" src="" class="w-4 h-4 rounded-full object-cover hidden">
                    <p id="reader-author" class="text-[10px] font-black text-indigo-600 uppercase tracking-widest">LOADING</p>
                </div>
            </div>
            <div class="w-10"></div>
        </div>
        <div class="max-w-3xl mx-auto px-6 py-12">
            <div id="reader-content" class="serif text-slate-800 text-lg leading-relaxed whitespace-pre-wrap"></div>
        </div>
    </div>

<script src="noverjs.js"></script>
</body>
</html>
