name: Auto Secure All Files

on:
  push:
    branches:
      - main

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Tools
        run: |
          npm install -g javascript-obfuscator html-minifier-terser clean-css-cli

      - name: Process All Files
        run: |
          # 1. ACAK semua file JavaScript (.js)
          find . -type f -name "*.js" ! -path "*/node_modules/*" -exec javascript-obfuscator {} --output {} --string-array true --self-defending true --compact true \;

          # 2. KOMPRES semua file HTML (.html)
          # Ini akan menghapus spasi dan komentar agar kode rapat
          find . -type f -name "*.html" ! -path "*/node_modules/*" -exec html-minifier-terser {} --output {} --collapse-whitespace --remove-comments --minify-js true --minify-css true \;

          # 3. KOMPRES semua file CSS (.css)
          find . -type f -name "*.css" ! -path "*/node_modules/*" -exec cleancss -o {} {} \;
          
      - name: Commit and Push to Production
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b production || git checkout production
          git add .
          git commit -m "Bot: Keamanan & Optimasi Total (JS, HTML, CSS)"
          git push origin production --force
