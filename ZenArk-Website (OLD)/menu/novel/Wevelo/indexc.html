<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Penulis - Web Novel</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <h2>Area Penulis</h2>

    <section>
        <h3>Unggah Naskah Novel</h3>
        <form action="/api/upload" method="POST" enctype="multipart/form-data">
            <label for="judul">Judul Novel:</label>
            <input type="text" id="judul" name="judul" required><br><br>
            
            <label for="naskah">Pilih File (PDF, DOC, DOCX, TXT):</label>
            <input type="file" id="naskah" name="naskah" accept=".pdf, .doc, .docx, .txt" required><br><br>
            
            <button type="submit">Unggah Naskah</button>
        </form>
    </section>

    <hr>

    <section>
        <h3>Tulis Langsung di Aplikasi</h3>
        <div id="editor" style="height: 300px;">
            <p>Mulai ketik bab pertamamu di sini...</p>
        </div>
        <br>
        <button onclick="simpanTulisan()">Publikasikan / Simpan</button>
    </section>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        var quill = new Quill('#editor', {
            theme: 'snow'
        });

        function simpanTulisan() {
            // Mengambil isi teks berformat HTML dari editor
            var konten = quill.root.innerHTML;
            console.log("Konten yang akan dikirim ke database:", konten);
            alert("Fitur simpan akan mengirim data ini ke backend!");
        }
    </script>
</body>
</html>
