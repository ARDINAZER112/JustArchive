<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelKu - Platform Menulis Masa Kini</title>
    <link rel="icon" type="image/x-icon" href="novelicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    
    <script src="noverjs.js"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.getItem('novelku-theme') === 'dark' || (!('novelku-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
   <link rel="stylesheet" href="stylenovel.css">
</head>
<body class="bg-[#F9FAFB] dark:bg-slate-950 text-slate-900 dark:text-slate-100 overflow-x-hidden transition-colors duration-300">

    <div id="toast-container" class="fixed top-24 right-6 z-50 flex flex-col gap-3"></div>

<nav class="sticky top-0 z-40 glass animate-fade-in border-b border-slate-200/60 dark:border-slate-800/60 px-4 sm:px-6 py-3 sm:py-4 transition-colors duration-300">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            
            <div class="flex items-center gap-2 sm:gap-3 cursor-pointer group flex-shrink-0" onclick="clearSearchAndGoHome()">
                <div class="bg-indigo-600 dark:bg-indigo-500 p-2 sm:p-2.5 rounded-xl sm:rounded-2xl text-white shadow-indigo-200 dark:shadow-indigo-900/50 shadow-xl group-hover:scale-110 transition-transform">
                   <svg width="20" height="20" class="sm:w-6 sm:h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h6"/><path d="M8 11h8"/></svg>
                </div>
                <span class="text-xl sm:text-2xl font-extrabold tracking-tighter text-slate-900 dark:text-white hidden md:block">Novel<span class="text-indigo-600 dark:text-indigo-400">Ku</span></span>
            </div>

            <div class="search-box max-w-lg mx-auto relative hidden sm:block">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="nav-search-desktop" oninput="handleNavSearch(this.value)" placeholder="Cari karya, penulis, kategori...">
            </div>

            <div id="nav-actions" class="flex items-center gap-3 sm:gap-4 flex-shrink-0"></div>
            
        </div>
        
        <div class="search-box mt-3 relative sm:hidden">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="nav-search-mobile" oninput="handleNavSearch(this.value)" placeholder="Cari karya, penulis...">
        </div>
    </nav>

    <main id="app-view" class="max-w-7xl mx-auto px-6 py-12 min-h-screen"></main>

    <input type="file" id="avatar-input" accept="image/png, image/jpeg, image/jpg, image/webp" class="hidden" onchange="handleAvatarUpload(event)">

    <input type="file" id="poster-input" accept="image/png, image/jpeg, image/jpg, image/webp" class="hidden" onchange="handlePosterPreview(event)">

    <div id="reader-view" class="fixed inset-0 bg-white dark:bg-slate-950 z-50 hidden overflow-y-auto transition-colors duration-300">
        <div class="sticky top-0 bg-white/95 dark:bg-slate-950/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between z-10 transition-colors duration-300">
            <button onclick="closeReader()" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-all text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="text-center px-2 sm:px-4 flex-1 max-w-lg overflow-hidden">
                <h2 id="reader-title" class="font-extrabold text-slate-900 dark:text-white truncate text-base sm:text-lg">Memuat...</h2>
                <div class="flex items-center justify-center gap-1.5 sm:gap-2 mt-0.5">
                    <img id="reader-avatar" src="" class="w-4 h-4 sm:w-5 sm:h-5 rounded-full object-cover hidden">
                    <p id="reader-author" class="text-[9px] sm:text-[10px] font-black text-indigo-600 dark:text-indigo-400 uppercase tracking-[0.2em] truncate">MEMUAT PENULIS</p>
                </div>
            </div>
            <div class="flex items-center gap-1 sm:gap-2">
                <button onclick="document.getElementById('reader-content').classList.toggle('text-2xl')" class="p-2 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 font-serif text-sm sm:text-base">A+</button>
            </div>
        </div>
        <div class="max-w-3xl mx-auto px-6 sm:px-8 py-10 sm:py-16">
            <div id="reader-content" class="serif text-slate-800 dark:text-slate-200 text-lg sm:text-xl leading-[1.8] transition-all break-words"></div>
        </div>
    </div>

    <script>
        // Setup PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</body>
</html>
