<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atur Ulang Kata Sandi - NovelKu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }

    /* Animasi Transisi Halus (NovelKu) */
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInLeft {
            0% { opacity: 0; transform: translateX(-40px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        .animate-fade-in-up { animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .animate-fade-in-left { animation: fadeInLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; opacity: 0; }
        
        /* Utilitas Jeda Animasi (Delay) */
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }
    </style>
    
    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.getItem('novelku-theme') === 'dark' || (!('novelku-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-white dark:bg-slate-950 m-0 p-0 overflow-x-hidden transition-colors duration-300">
    <div class="flex flex-col md:flex-row min-h-screen">
        
        <div class="animate-fade-in-left w-full md:w-5/12 lg:w-1/2 p-8 sm:p-12 md:p-16 flex flex-col justify-between md:justify-center text-white relative overflow-hidden min-h-[40vh] md:min-h-screen bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1457369804613-52c61a468e7d?q=80&w=1000&auto=format&fit=crop');">
    
    <div class="absolute inset-0 bg-slate-900/60 dark:bg-slate-900/80"></div>
            <div class="absolute -top-32 -left-32 w-80 h-80 bg-white opacity-10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-white opacity-10 rounded-full blur-3xl"></div>
            
            <div class="relative z-10 flex-1 flex flex-col justify-center">
                <div class="flex items-center gap-3 mb-6 md:mb-10">
                    <div class="bg-white/20 p-2.5 md:p-3 rounded-2xl backdrop-blur-sm">
                       <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h6"/><path d="M8 11h8"/></svg>
                    </div>
                    <span class="text-2xl md:text-3xl font-extrabold tracking-tighter">NovelKu</span>
                </div>
                <h2 class="text-3xl md:text-5xl font-black mb-4 md:mb-6 tracking-tight leading-tight">Amankan<br>Akunmu.</h2>
                <p class="text-indigo-100/90 font-medium leading-relaxed text-sm md:text-lg max-w-md">Buat kata sandi baru yang kuat agar karya dan draf naskahmu tetap aman.</p>
            </div>
        </div>

        <div class="animate-fade-in-up w-full md:w-7/12 lg:w-1/2 p-8 sm:p-12 lg:p-20 flex flex-col justify-center bg-white dark:bg-slate-950 min-h-[60vh] md:min-h-screen">
            <div class="max-w-md w-full mx-auto">
                <div class="mb-8 mt-4 md:mt-0">
                    <h1 class="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white tracking-tight">Kata Sandi Baru</h1>
                    <p class="text-slate-500 dark:text-slate-400 text-sm mt-2">Silakan masukkan kata sandi baru yang kuat untuk akun kamu.</p>
                </div>
                
                <div class="space-y-5">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-2 block">Kata Sandi Baru</label>
                        <input type="password" id="new-password" placeholder="Minimal 6 Karakter" class="w-full p-4 bg-slate-50 dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 dark:focus:border-indigo-400 font-bold text-slate-900 dark:text-white transition-all">
                    </div>
                    
                    <button onclick="handleUpdatePassword()" id="btn-update" class="w-full py-4 md:py-5 bg-slate-900 dark:bg-indigo-600 text-white rounded-2xl font-black shadow-lg hover:bg-indigo-600 dark:hover:bg-indigo-500 hover:shadow-indigo-200 dark:hover:shadow-indigo-900/50 transition-all active:scale-95 mt-4 text-sm uppercase tracking-widest">
                        Perbarui Kata Sandi
                    </button>
                    
                    <p id="msg" class="text-center text-sm font-bold mt-4"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bqplhvnkigosfeodcjoy.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxcGxodm5raWdvc2Zlb2Rjam95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNjI5MzgsImV4cCI6MjA5MjkzODkzOH0.maYEJAZqccHbfrBKbk_INXb3cD9cMdNvae3ngKcVXDI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleUpdatePassword() {
            const newPassword = document.getElementById('new-password').value;
            const btn = document.getElementById('btn-update');
            const msg = document.getElementById('msg');

            if (newPassword.length < 6) {
                msg.innerText = "Kata sandi minimal 6 karakter!";
                msg.className = "text-center text-sm font-bold mt-4 text-red-500 dark:text-red-400";
                return;
            }

            btn.disabled = true;
            btn.innerText = "MEMPROSES...";

            const { error } = await _supabase.auth.updateUser({ password: newPassword });

            if (error) {
                msg.innerText = "Gagal: " + error.message;
                msg.className = "text-center text-sm font-bold mt-4 text-red-500 dark:text-red-400";
                btn.disabled = false;
                btn.innerText = "PERBARUI KATA SANDI";
            } else {
                msg.innerText = "Berhasil! Mengalihkan...";
                msg.className = "text-center text-sm font-bold mt-4 text-green-500 dark:text-emerald-400";
                setTimeout(() => { window.location.href = 'novelku.html'; }, 2000);
            }
        }
    </script>
</body>
</html>
