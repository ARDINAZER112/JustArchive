<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #chat-container {
            width: 100%;
            max-width: 600px;
            background: #313244;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            height: 85vh;
            overflow: hidden;
        }
        .header {
            background: #45475a;
            padding: 15px 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 1px solid #585b70;
        }
        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
            line-height: 1.5;
        }
        .user-msg { background: #89b4fa; color: #11111b; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background: #585b70; color: #cdd6f4; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 15px 20px; background: #181825; gap: 10px; border-top: 1px solid #313244; }
        input[type="text"] { flex-grow: 1; padding: 12px; border: 1px solid #585b70; border-radius: 8px; background: #1e1e2e; color: #cdd6f4; outline: none; }
        input[type="text"]:focus { border-color: #89b4fa; }
        button { padding: 12px 20px; background: #89b4fa; color: #11111b; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #74c7ec; }
        .loading { font-style: italic; color: #a6adc8; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="header">Chat Assistant</div>
        <div id="chat-box">
            <div class="message bot-msg">Halo! Ada yang bisa saya bantu?</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ketik pesan..." />
            <button id="send-btn">Kirim</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
