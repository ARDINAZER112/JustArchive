<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luxi</title>
  </head>
  <body>
    <script type="module" src="https://cdn.landbot.io/landbot-3/landbot-3.0.0.mjs"></script>
    <script type="module">
      var myLandbot = new Landbot.Fullpage({
        configUrl: 'https://storage.googleapis.com/landbot.online/v3/H-3392862-X1R7FAPKDWS26Z2T/index.json',
      });
    </script>
    <script>
  var myLandbot;
  function initLandbot() {
    if (!myLandbot) {
      var s = document.createElement('script');
      s.type = "module";
      s.async = true;
      s.addEventListener('load', function() {
        myLandbot = new Landbot.Livechat({
          configUrl: 'https://storage.googleapis.com/landbot.online/v3/H-3392862-X1R7FAPKDWS26Z2T/index.json',
        });
      });
      s.src = 'https://cdn.landbot.io/landbot-3/landbot-3.0.0.mjs';
      var x = document.getElementsByTagName('script');
      x.parentNode.insertBefore(s, x);
    } else {
      myLandbot.open();
    }
  }
  document.addEventListener('DOMContentLoaded', () => {
    const contactBtn = document.querySelector('a[href="#contact"]'); 
    if(contactBtn) {
        contactBtn.addEventListener('click', (e) => {
            e.preventDefault();
            initLandbot();
        });
    }
  });
</script>
  </body>
</html>
