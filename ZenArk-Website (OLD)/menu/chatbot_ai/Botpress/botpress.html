<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARC - ARC Assistant (Luxis)</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;  
            overflow: hidden; 
        }

        body {
            background-color: black; 
            
            background-image: url('poster.gif'); 
            
            background-size: cover;      
            background-position: center; 
            background-repeat: no-repeat;
            background-attachment: fixed; 
            
            font-family: Arial, sans-serif;
        }


        .bp-widget-widget, .bp-w3-iframe-wrapper {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border: none !important;
            border-radius: 0 !important; 
            box-shadow: none !important;
            z-index: 999999; 
        }
        
        .bp-widget-widget .bp-w3-iframe-wrapper iframe {
            opacity: 0.9 !important; 
        }

.bp-widget-widget,
.bpw-chat-container {
    background-image: url('https://www.luxinesid.my.id/asset/img/poster.gif') !important;
    background-size: cover !important;
    background-position: center !important;
}
    </style>
</head>
<body>

    <div id="bp-embedded-webchat" style="width: 100%; height: 100%;"></div>

    <!-- ========================================== -->
    <!-- KODE SCRIPTS BOTPRESS -->
    <!-- ========================================== -->
    

    <script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
<script src="https://files.bpcontent.cloud/2026/04/13/08/20260413081710-HNN39S03.js" defer></script>
    
    
    <!-- Script inisialisasi -->
    <script>
      window.botpressWebChat.init({
          "clientId": "GANTI_DENGAN_CLIENT_ID_BOT_ANDA", 
          "hostUrl": "https://cdn.botpress.cloud/webchat/v3",
          "messagingUrl": "https://messaging.botpress.cloud",
          
          "containerId": "bp-embedded-webchat",
          "hideWidget": true, 
          "disableAnimations": false,
      });
    </script>

</body>
</html>
